name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-22.04
            cxx: g++
          - name: windows-msvc
            os: windows-2022
            cxx: cl
          - name: windows-mingw
            os: windows-2022
            cxx: g++
          - name: macos-clang
            os: macos-14
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: matrix.name != 'windows-msvc'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        if: matrix.name != 'windows-msvc'
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=Release

      - name: Configure (MSVC)
        if: matrix.name == 'windows-msvc'
        run: cmake -B build -G "Visual Studio 17 2022"

      - name: Build
        run: cmake --build build --config Release
